name: PullRequest

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  buildTest:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        api: [ 28 ]
        tag: [ default ]
        abi: [ x86_64 ]
        emulatorApi: [ 9 ]
        java_version: [ 17 ]
    steps:
      - name: kvm support
        run: |
          egrep -c '(vmx|svm)' /proc/cpuinfo
          id
          sudo adduser $USER kvm
          sudo chown -R $USER /dev/kvm
          id
      - name: prepare
        run: |
          sudo apt-get update && sudo apt-get install -y exiftool imagemagick xdg-utils libimage-exiftool-perl zsh jq xorg
      #          brew install exiftool imagemagick
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Install JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java_version }}
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Install Android SDK
        uses: hannesa2/action-android/install-sdk@0.17.0
      - name: Run instrumentation tests
        uses: hannesa2/action-android/emulator-run-cmd@0.17.0
        with:
          cmd: ./gradlew connectedAndroidTest --continue
          api: ${{ matrix.api }}
          tag: ${{ matrix.tag }}
          abi: ${{ matrix.abi }}
          cmdOptions: -noaudio -no-boot-anim -no-window -metrics-collection
          disableAnimations: true
      - name: Archive Espresso results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Chart-Espresso-report-${{ matrix.api }}-${{ matrix.tag }}-${{ matrix.abi }}-${{ matrix.emulatorApi }}
          path: app/build/reports/androidTests/connected
          if-no-files-found: error
      - name: Archive screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Chart-Screenshots-${{ matrix.api }}-${{ matrix.tag }}-${{ matrix.abi }}-${{ matrix.emulatorApi }}
          path: |
            app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected
            app/build/outputs/androidTest-results/connected
      - name: Compare screenshots
        env:
          CLASSIC_TOKEN: ${{ secrets.CLASSIC_TOKEN }}
          emulatorApi: ${{ matrix.emulatorApi }}
          SCREENSHOT_USER: ${{ secrets.SCREENSHOT_USER }}
          SCREENSHOT_PASSWORD: ${{ secrets.SCREENSHOT_PASSWORD }}
        run: |
          ls -la app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected
          cp app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/emulator-5554\ -\ ${{ matrix.emulatorApi }}/* screenshotsToCompare${{ matrix.emulatorApi }}
          ./screenShotScript/screenShotCompare.sh
      - name: Archive screenshots diffs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Chart-Screenshots-diffs-${{ matrix.api }}-${{ matrix.tag }}-${{ matrix.abi }}-${{ matrix.emulatorApi }}
          path: |
            screenshotDiffs
      - name: Show git status
        if: ${{ always() }}
        run: |
          git add screenshotsToCompare${{ matrix.emulatorApi }}
          git status
          [ "$(git status -s -uno)" ] && exit 1 || exit 0
  Check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java_version: [ 17 ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Install JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java_version }}
      - name: Install Android SDK
        uses: hannesa2/action-android/install-sdk@0.17.0
      - name: Run tests
        run: ./gradlew test
      - name: Test jitpack publish command
        run: ./gradlew :chartLib:publishToMavenLocal :chartLibCompose:publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false
      - name: Code checks
        run: ./gradlew check
      - name: Archive Lint report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Chart-Lint-report
          path: ./**/build/reports/lint-results*.html
  KotlinMultiplatform:
    name: Kotlin Multiplatform (iOS/Desktop)
    # iOS simulator targets (chartLibCore/chartLibComposeMultiplatform) require a macOS runner
    # with Xcode; on the ubuntu "Check" job these tasks are silently skipped
    # (kotlin.native.ignoreDisabledTargets=true), so this job is the only place they actually run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 17
      - name: Install Android SDK
        uses: hannesa2/action-android/install-sdk@0.17.0
      - name: Run chartLibCore/chartLibComposeMultiplatform tests (Android host, Desktop, iOS simulator)
        run: ./gradlew :chartLibCore:allTests :chartLibComposeMultiplatform:allTests
      - name: Build demoKmp (all targets) and demoKmpAndroid
        run: ./gradlew :demoKmp:build :demoKmpAndroid:assembleDebug
      - name: Desktop smoke-test (demoKmp:run starts without crashing)
        run: |
          ./gradlew :demoKmp:run --console=plain &
          run_pid=$!
          sleep 25
          if kill -0 "$run_pid" 2>/dev/null; then
            echo "demoKmp:run is still running after 25s -> desktop app launched successfully"
            kill "$run_pid"
            wait "$run_pid" 2>/dev/null || true
          else
            wait "$run_pid"
            exit_code=$?
            echo "demoKmp:run exited early with code $exit_code"
            exit 1
          fi
      - name: Archive Kotlin Multiplatform test reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Chart-KotlinMultiplatform-test-report
          path: |
            chartLibCore/build/reports/tests
            chartLibComposeMultiplatform/build/reports/tests
          if-no-files-found: warn
