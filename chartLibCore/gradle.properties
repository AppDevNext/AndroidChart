# Overrides the root-level POM_ARTIFACT_ID=chart for this Kotlin Multiplatform module.
#
# com.vanniktech.maven.publish's MavenPublishPlugin automatically calls
# pomFromGradleProperties() at apply-time, which eagerly renames every per-target KMP
# publication (android/desktop/iosArm64/...) using the root POM_ARTIFACT_ID. Our own
# mavenPublishing { coordinates(...) } call in build.gradle.kts then runs afterwards and
# tries to rename the *already renamed* publications, which fails because they no longer
# start with the expected "chartLibCore-" prefix. Overriding POM_ARTIFACT_ID here makes
# both passes agree, so the second (redundant) rename is a no-op.
POM_ARTIFACT_ID=chartLibCore
