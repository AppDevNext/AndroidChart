android.enableJetifier=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4092M

# OSSRH was shut down on June 30, 2025. Using CENTRAL_PORTAL instead.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
POM_ARTIFACT_ID=chart
android.nonTransitiveRClass=false

# chartLibCore is a Kotlin Multiplatform module with iOS targets, which cannot be
# compiled/tested on non-macOS CI runners (e.g. the Linux "Check" job). Without this,
# Gradle fails the build instead of just skipping those disabled native tasks.
kotlin.native.ignoreDisabledTargets=true
